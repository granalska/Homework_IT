version: "3.8"
services:
  app:
    build: .
    ports:
      - '3000:3000'
      - '5000:5000'
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  mongo_data: