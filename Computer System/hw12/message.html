<!DOCTYPE html>
<html lang = 'ua'>
    <head>
        <link rel="stylesheet" href = 'style.css'>
         <style>
body {font-family: system-ui, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top, #6a00ff, #12001f 60%, #0b0b12);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;}

.header {text-align: center;
    margin-bottom: 20px;}

.logo {display: block;
    margin: 0 auto 10px;
    width: 120px;}

.content {margin-top: 10px;}

input, textarea {width: 100%;
    box-sizing: border-box;
    padding: 10px;
    margin-top: 6px;
    border-radius: 10px;
    border: none;
    outline: none;}

input[type="submit"], input[type="reset"] {width: auto;
    margin-top: 10px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 10px;
    border: none;
    background: #b388ff;
    color: white;}
        </style>
        <meta charset = "UTF-8">
        <meta name="description" content="Вебсторінка для обміну повідомленнями через WebSocket">
        <title>WebSocket для клієнтів</title>
    </head>
        <body>
        <div class="container">

            <div class="header">
                <img src="websock.jpeg" width="120" alt="Логотип" class="logo">
                <h1>Обмін повідомленнями</h1>
            </div>
            <div class="content">
                <p>Введіть ваше ім’я та повідомлення та натисніть кнопку для передачі даних на сервер для обробки та збереження.</p>
                <hr>
                <form action="/message" method="post">
                    <input type="hidden" name="user_id" id="user_id">

                    <label>Введіть ваше ім’я</label>
                    <input type="text" name="username" placeholder="Enter name"><br><br>

                    <label>Введіть ваше повідомлення</label>
                    <textarea name="message" placeholder="Enter message"></textarea><br><br>

                    <label>Додайте файл або фото</label>
                    <input type="file" name="file"><br><br>

                    <input type="submit" value="Відправити"><br><br>
                    <input type="reset" value="Очистити">
                </form>
            </div>
        </div>
        </body>
</html>
